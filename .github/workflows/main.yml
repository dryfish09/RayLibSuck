name: Build and Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.calc.outputs.build_number }}
      tag: ${{ steps.calc.outputs.tag }}
      title: ${{ steps.calc.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate build number and date
        id: calc
        run: |
          COUNT=$(git tag -l "build-*" | wc -l)
          NEXT=$((COUNT + 1))
          DATE_TAG=$(date +%d%m%y)
          DATE_TITLE=$(date +%d-%m-%y)
          echo "build_number=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=build-$NEXT-$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "title=build #$NEXT - $DATE_TITLE" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Build raylib from source
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake -DBUILD_SHARED_LIBS=OFF -DPLATFORM=Desktop ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build game
        run: |
          g++ main.cpp -o game-linux -O2 \
            -lraylib -lGL -lm -lpthread -ldl -lrt -lX11

      - name: Package
        run: |
          mkdir -p dist
          cp game-linux dist/
          cd dist && zip -r ../game-linux.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: game-linux
          path: game-linux.zip

  build-macos:
    needs: prep
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install raylib
        run: brew install raylib

      - name: Build game
        run: |
          clang++ main.cpp -o game-macos -O2 \
            -I$(brew --prefix raylib)/include \
            -L$(brew --prefix raylib)/lib \
            -lraylib \
            -framework OpenGL -framework Cocoa -framework IOKit -framework CoreVideo

      - name: Package
        run: |
          mkdir -p dist
          cp game-macos dist/
          cd dist && zip -r ../game-macos.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: game-macos
          path: game-macos.zip

  release:
    needs: [prep, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: game-linux

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: game-macos

      - name: Create tag
        run: |
          git tag "${{ needs.prep.outputs.tag }}"
          git push origin "${{ needs.prep.outputs.tag }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep.outputs.tag }}
          name: ${{ needs.prep.outputs.title }}
          files: |
            game-linux.zip
            game-macos.zip
          generate_release_notes: true
