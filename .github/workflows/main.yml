name: Build and Release

on:
  push:
    branches: '*'
    paths-ignore:
      - '**.md'
  pull_request: 
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.calc.outputs.build_number }}
      tag: ${{ steps.calc.outputs.tag }}
      title: ${{ steps.calc.outputs.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate build number and date
        id: calc
        run: |
          COUNT=$(git tag -l "build-*" | wc -l)
          NEXT=$((COUNT + 1))
          DATE_TAG=$(date +%d%m%y)
          DATE_TITLE=$(date +%d-%m-%y)
          echo "build_number=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=build-$NEXT-$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "title=build #$NEXT - $DATE_TITLE" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake zip \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Build raylib from source
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake -DBUILD_SHARED_LIBS=OFF -DPLATFORM=Desktop \
            -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build game
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          cp build/game game-linux
          echo "=== build done ==="
          ls -la game-linux
          file game-linux

      - name: Package
        run: |
          zip -r game-linux.zip game-linux src/assets/ run.sh
          ls -la game-linux.zip

      - uses: actions/upload-artifact@v7
        with:
          name: game-linux
          path: game-linux.zip

  build-macos:
    needs: prep
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cmake
        run: brew install cmake

      - name: Build raylib from source
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake -DBUILD_SHARED_LIBS=OFF -DPLATFORM=Desktop \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j$(sysctl -n hw.ncpu)
          sudo make install
          ls -la /usr/local/lib/libraylib.a

      - name: Build game
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)
          cp build/game game-macos
          echo "=== build done ==="
          ls -la game-macos
          file game-macos

      - name: Package
        run: |
          zip -r game-macos.zip game-macos src/assets/
          ls -la game-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: game-macos
          path: game-macos.zip

  build-windows:
    needs: prep
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ninja
            git
            zip

      - name: Build raylib from source
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake -G Ninja \
            -DBUILD_SHARED_LIBS=OFF \
            -DPLATFORM=Desktop \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw64 ..
          ninja
          ninja install

      - name: Build game
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp build/game.exe game-windows.exe
          echo "=== build done ==="
          ls -la game-windows.exe
          file game-windows.exe

      - name: Package
        run: |
          zip -r game-windows.zip game-windows.exe src/assets/
          ls -la game-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: game-windows
          path: game-windows.zip

  release:
    needs: [prep, build-linux, build-macos, build-windows]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Linux build
        uses: actions/download-artifact@v8
        with:
          name: game-linux

      - name: Download macOS build
        uses: actions/download-artifact@v8
        with:
          name: game-macos

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: game-windows

      - name: Create tag
        run: |
          git tag "${{ needs.prep.outputs.tag }}"
          git push origin "${{ needs.prep.outputs.tag }}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prep.outputs.tag }}
          name: ${{ needs.prep.outputs.title }}
          files: |
            game-linux.zip
            game-macos.zip
            game-windows.zip
          generate_release_notes: true
